[pytest]
;addopts = -s -q --html=report.html
;testpaths = testcases
python_files = test*.py
python_classes = Test*
python_functions = test*
;log_cli = True
;log_date_format = %Y-%m-%d %H-%M-%S
;log_level = DEBUG
;log_format = %(asctime)s - %(filename)s - %(module)s - %(funcName)s - %(lineno)d - %(levelname)s - %(message)s
;log_file = test.log

# 注册自定义标记（推荐做法，既能消除警告又能让标记有效）
markers =
    bilibili: Bilibili related tests
    baidu: Baidu related tests
    google: Google related tests

# 忽略警告（使用消息匹配，避免 category 路径问题）
filterwarnings =
    ignore:Unknown pytest\.mark\..*
    ignore:.*urllib3 v2 only supports OpenSSL.*

